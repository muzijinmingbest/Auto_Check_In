name: Quark Check-in

on:
  schedule:
    - cron: '0 1-23/2 * * *'
  workflow_dispatch: {}

concurrency:
  group: quark-checkin
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Run Quark check-in
        env:
          COOKIE_QUARK: ${{ secrets.COOKIE_QUARK }}
        run: python checkIn_Quark.py
      - name: Keep-alive commit
        run: |
          if [ "$(date +%d)" = "01" ]; then
            date -u > .keepalive
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .keepalive
            git commit -m "chore: keep-alive $(date -u +%Y-%m)" || exit 0
            git push
          fi
