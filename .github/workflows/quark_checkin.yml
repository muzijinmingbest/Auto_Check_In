name: Quark Check-in

on:
  schedule:
    - cron: '5 1 * * *'   # 北京时间每天 09:05
    - cron: '5 5 * * *'   # 北京时间每天 13:05（二次尝试）
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: Run Quark check-in
        env:
          COOKIE_QUARK: ${{ secrets.COOKIE_QUARK }}
        run: python checkIn_Quark.py
